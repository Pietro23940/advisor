<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precios · Montaje PC</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5c6b78;--line:#d5dce3;--acc:#0b7a75;--best:#1f8a4c;--bestbg:#e4f4ea;--down:#1f8a4c;--up:#b3402a}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mute:#93a3b1;--line:#2a3743;--acc:#3cc4bb;--best:#5fd68a;--bestbg:#17301f;--down:#5fd68a;--up:#ff8a73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1060px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:26px;margin:0 0 4px;font-weight:600}
.sub{color:var(--mute);margin:0 0 20px}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:160px}
.sum small{display:block;color:var(--mute);font-size:12px}
.sum b{font:500 20px "IBM Plex Mono",monospace}
.sum .mix{border-color:var(--best);background:var(--bestbg)}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:120px 1fr;gap:16px}
.item img{width:120px;height:120px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)}
.item h2{font-size:17px;margin:0;font-weight:600}
.item p{margin:2px 0 12px;color:var(--mute);font-size:13px}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.s{border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.s.best{border-color:var(--best);background:var(--bestbg)}
.s .n{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.s a{color:var(--acc);text-decoration:none;font-weight:500}
.s a:hover,.s a:focus-visible{text-decoration:underline}
.s .p{font:500 18px "IBM Plex Mono",monospace}
.s .p.none{color:var(--mute);font-size:14px}
.s .d{font-size:12px}.d.down{color:var(--down)}.d.up{color:var(--up)}
.s .e{font-size:11px;color:var(--mute)}
@media(max-width:560px){.item{grid-template-columns:1fr}.item img{width:96px;height:96px}}
</style>
</head>
<body>
<main>
<h1>Precios de mi montaje de PC</h1>
<p class="sub" id="upd"></p>
<div class="sum" id="sum"></div>
<div id="list"></div>
</main>
<script src="data/precios.js"></script>
<script>
const NOMBRES={amazon:"Amazon.es",pccomponentes:"PcComponentes",neobyte:"Neobyte",coolmod:"Coolmod",pcbox:"PcBox"};
const eur=n=>n.toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const D=window.DATOS||{productos:[],precios:{}};
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="#e5e9ed"/><text x="60" y="65" font-size="12" text-anchor="middle" fill="#5c6b78">Sin imagen</text></svg>');
const totals={};let mix=0,mixN=0;
document.getElementById("upd").textContent=D.actualizado?"Última comprobación: "+new Date(D.actualizado).toLocaleString("es-ES"):"Aún no hay datos. Ejecuta el vigilante.";
document.getElementById("list").innerHTML=D.productos.map(p=>{
  const rec=D.precios[p.id]||{};
  const vals=Object.entries(p.tiendas).filter(([s,u])=>u).map(([s,u])=>({s,u,r:rec[s]||{}}));
  const prices=vals.map(v=>v.r.precio).filter(x=>x!=null);
  const min=prices.length?Math.min(...prices):null;
  if(min!=null){mix+=min;mixN++}
  vals.forEach(v=>{if(v.r.precio!=null){const t=totals[v.s]||(totals[v.s]={sum:0,n:0});t.sum+=v.r.precio;t.n++}});
  const img=p.imagen||`https://m.media-amazon.com/images/P/${p.asin}.01._SCLZZZZZZZ_.jpg`;
  return `<section class="item"><img src="${img}" alt="${p.nombre}" loading="lazy" onerror="this.onerror=null;this.src=PH"><div><h2>${p.nombre}</h2><p>${p.detalle}</p><div class="stores">${vals.map(v=>{
    const h=v.r.historial||[];const prev=h.length>1?h[h.length-2][1]:null;
    const diff=prev!=null&&v.r.precio!=null?v.r.precio-prev:null;
    const best=v.r.precio!=null&&v.r.precio===min&&prices.length>1;
    return `<div class="s${best?" best":""}"><div class="n"><span>${NOMBRES[v.s]||v.s}</span><a href="${v.u}" target="_blank" rel="noopener">Abrir</a></div>
    <div class="p${v.r.precio==null?" none":""}">${v.r.precio!=null?eur(v.r.precio):"Sin precio"}</div>
    ${diff?`<div class="d ${diff<0?"down":"up"}">${diff<0?"▼":"▲"} ${eur(Math.abs(diff))}</div>`:""}
    ${v.r.error?`<div class="e">${v.r.error}</div>`:""}</div>`}).join("")}</div></div></section>`}).join("");
document.getElementById("sum").innerHTML=Object.entries(totals).map(([s,t])=>`<div><small>${NOMBRES[s]||s} (${t.n}/${D.productos.length})</small><b>${eur(t.sum)}</b></div>`).join("")+`<div class="mix"><small>Mejor combinación (${mixN}/${D.productos.length})</small><b>${eur(mix)}</b></div>`;
</script>
</body>
</html>
