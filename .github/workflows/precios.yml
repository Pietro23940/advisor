name: Vigilar precios
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      prueba_aviso:
        description: "Enviar una notificación de prueba al móvil"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: precios
  cancel-in-progress: false
jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python vigilante.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRUEBA_AVISO: ${{ inputs.prueba_aviso }}
      - name: Guardar precios
        run: |
          git config user.name "vigilante-precios"
          git config user.email "actions@users.noreply.github.com"
          git add data img
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar precios"
          git pull --rebase -X theirs origin main
          git push
